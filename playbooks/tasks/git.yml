# Shared git-buildpackage finalization tasks. Run in playbook post_tasks, after
# the package source tree has been filled (downloaded, unpacked, stripped,
# modified).
#
# Required inputs:
#   dsc_url     - DSC file URL, e.g. .../package_1.2.3-1.dsc
#   build_root  - root build directory
#
# Path layout (source_dirname = dsc basename without .dsc extension):
#   build_dir   = build_root/<package-name>
#   source_dir  = build_dir/<source_dirname>

- name: Calculate and set package source variables
  ansible.builtin.set_fact:
    dsc_file: "{{ dsc_url | basename }}"
    source_dirname: "{{ (dsc_url | basename) | splitext | first }}"
    build_dir: "{{ build_root }}/{{ (dsc_url | basename) | split('_') | first }}"
    source_dir: "{{ build_root }}/{{ (dsc_url | basename) | split('_') | first }}/{{ (dsc_url | basename) | splitext | first }}"
    package_version: "{{ dsc_url | regex_replace('.*_([0-9.]+)-[0-9.]+.*', '\\1') }}"

- name: Ensure source directory exists
  ansible.builtin.file:
    path: "{{ source_dir }}"
    state: directory
    mode: '0755'

- name: Set git environment variables
  ansible.builtin.set_fact:
    git_env:
      GIT_AUTHOR_EMAIL: "builder@example.com"
      GIT_AUTHOR_NAME: "Package Builder"
      GIT_COMMITTER_EMAIL: "builder@example.com"
      GIT_COMMITTER_NAME: "Package Builder"

- name: Initialize git repository in source directory
  ansible.builtin.command:
    cmd: git init
    chdir: "{{ source_dir }}"
  environment: "{{ git_env }}"
  register: git_init_result
  changed_when: "'Reinitialized' not in git_init_result.stdout"

- name: Create upstream branch and commit source
  ansible.builtin.shell:
    cmd: |
      if git rev-parse --verify upstream >/dev/null 2>&1; then
        git checkout upstream
      else
        git checkout --orphan upstream
        git add .
        git rm -r --cached debian/ >/dev/null 2>&1 || true
        git commit -m "Import upstream source"
      fi
    chdir: "{{ source_dir }}"
  environment: "{{ git_env }}"
  register: upstream_branch_result
  changed_when: true

- name: Create upstream tag with package version
  ansible.builtin.command:
    cmd: git tag -a "upstream/{{ package_version }}" -m "Upstream version {{ package_version }}"
    chdir: "{{ source_dir }}"
  environment: "{{ git_env }}"
  register: git_tag_result
  changed_when: true
  failed_when:
    - git_tag_result.rc != 0
    - "'already exists' not in git_tag_result.stderr"

- name: Read gbp.conf to get debian-branch name
  ansible.builtin.shell:
    cmd: grep -Po 'debian-branch\s*=\s*\K\S+' "{{ source_dir }}/debian/gbp.conf" 2>/dev/null || echo "debian/master"
  register: gbp_conf_result
  changed_when: false

- name: Set debian-branch variable
  ansible.builtin.set_fact:
    debian_branch: "{{ gbp_conf_result.stdout | trim }}"

- name: Create and switch to debian-branch
  ansible.builtin.command:
    cmd: git checkout -b "{{ debian_branch }}"
    chdir: "{{ source_dir }}"
  environment: "{{ git_env }}"
  register: git_checkout_debian
  changed_when: true
  failed_when:
    - git_checkout_debian.rc != 0
    - "'already exists' not in git_checkout_debian.stderr"

- name: Add debian folder contents to git
  ansible.builtin.command:
    cmd: git add debian/
    chdir: "{{ source_dir }}"
  environment: "{{ git_env }}"
  changed_when: true

- name: Commit debian folder contents
  ansible.builtin.command:
    cmd: git commit -m "Initial debian packaging"
    chdir: "{{ source_dir }}"
  environment: "{{ git_env }}"
  register: git_commit_result
  changed_when: "'nothing to commit' not in git_commit_result.stdout"
  failed_when:
    - git_commit_result.rc != 0
    - "'nothing to commit' not in git_commit_result.stdout"

- name: Create debian tag with package version
  ansible.builtin.command:
    cmd: git tag -a "debian/{{ package_version }}" -m "Debian version {{ package_version }}"
    chdir: "{{ source_dir }}"
  environment: "{{ git_env }}"
  register: git_tag_debian_result
  changed_when: true
  failed_when:
    - git_tag_debian_result.rc != 0
    - "'already exists' not in git_tag_debian_result.stderr"