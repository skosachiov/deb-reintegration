- name: Calculate and set global driver source variables
  ansible.builtin.set_fact:
    nvidia_dsc_file: "{{ nvidia_dsc_url | basename }}"
    nvidia_source_dirname: "{{ (nvidia_dsc_url | basename) | splitext | first }}"
    nvidia_source_dir: "{{ nvidia_build_dir }}/{{ (nvidia_dsc_url | basename) | splitext | first }}"

# Now your tasks will work perfectly across all files without redefining vars:
- name: Remove dh-modaliases from Build-Depends
  ansible.builtin.lineinfile:
    path: "{{ nvidia_source_dir }}/debian/control"
    regexp: '^\s*dh-modaliases,?\s*$'
    state: absent

- name: Remove leftover dh_modaliases invocation from debian/rules
  ansible.builtin.lineinfile:
    path: "{{ nvidia_source_dir }}/debian/rules"
    regexp: '^\s*dh_modaliases\s*$'
    state: absent
