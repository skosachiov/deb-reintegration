- name: Install packaging tooling
  ansible.builtin.apt:
    name:
      - dpkg-dev
      - fakeroot
    state: present

- name: Extract package list from DSC Package-List field
  ansible.builtin.shell:
    cmd: |
      awk '/^Package-List:/{flag=1; next} /^[^ ]/{flag=0} flag && NF>=2 {print $1}' "{{ nvidia_build_dir }}/{{ nvidia_dsc_filename }}"
  register: package_list_output
  changed_when: false

- name: Set package list fact
  ansible.builtin.set_fact:
    nvidia_packages_info: "{{ package_list_output.stdout_lines | default([]) }}"

- name: Display package list
  ansible.builtin.debug:
    msg: "Packages to build: {{ nvidia_packages_info | join(', ') }}"
  when: nvidia_packages_info | length > 0

- name: Check which packages are already built using stat
  ansible.builtin.stat:
    path: "{{ nvidia_build_dir }}/{{ item.split(':')[0] }}_*.deb"
  loop: "{{ nvidia_packages_info | default([]) }}"
  register: package_stat_results
  when: nvidia_packages_info | length > 0
  ignore_errors: yes  # Glob patterns might not match

- name: Determine built vs missing packages
  ansible.builtin.set_fact:
    missing_packages: >-
      {{
        package_stat_results.results
        | selectattr('stat.exists', 'equalto', False)
        | map(attribute='item')
        | map('split', ':')
        | map('first')
        | list
      }}
    built_packages: >-
      {{
        package_stat_results.results
        | selectattr('stat.exists', 'equalto', True)
        | map(attribute='item')
        | map('split', ':')
        | map('first')
        | list
      }}
  when: package_stat_results.results is defined

- name: Display build status
  ansible.builtin.debug:
    msg:
      - "Total packages: {{ nvidia_packages_info | length }}"
      - "Already built: {{ built_packages | default([]) | length }}"
      - "Missing packages: {{ missing_packages | default([]) | length }}"
      - "Missing list: {{ missing_packages | default([]) | join(', ') }}"
  when: missing_packages is defined

- name: Set need_build fact
  ansible.builtin.set_fact:
    need_build: "{{ (missing_packages | default([]) | length) > 0 }}"

- name: Install build dependencies with mk-build-deps
  ansible.builtin.shell:
    cmd: yes | mk-build-deps -i -r
  args:
    chdir: "{{ nvidia_source_dir }}"
  register: nvidia_mk_build_deps_result
  when:
    - nvidia_install_build_deps | bool
    - need_build | bool

- name: Create backup
  vars:
    backup_dest: "/tmp/debian-{{ ansible_date_time.iso8601 | replace(':', '-') }}.tar.gz"
    backup_path: "{{ nvidia_source_dir }}/debian"
  archive:
    path: "{{ backup_path }}"
    dest: "{{ backup_dest }}"
    format: gz
    force_archive: true
  register: backup_result

- name: Build only missing packages
  ansible.builtin.command:
    cmd: dpkg-buildpackage -us -uc -b
  args:
    chdir: "{{ nvidia_source_dir }}"
  register: nvidia_build_result
  when:
    - nvidia_test_build | bool
    - need_build | bool

- name: Delete original folder
  file:
    path: "{{ backup_path }}"
    state: absent
  when: backup_result.changed

- name: Restore folder from backup
  unarchive:
    src: "{{ backup_dest }}"
    dest: "{{ backup_path | dirname }}"
    remote_src: yes
    copy: no
  when: backup_result.changed

- name: Display build results
  ansible.builtin.debug:
    msg: "Build completed for: {{ missing_packages | join(', ') }}"
  when:
    - nvidia_test_build | bool
    - need_build | bool

- name: Skip build - all packages already exist
  ansible.builtin.debug:
    msg: "All {{ nvidia_packages_info | length }} packages already built. Skipping build."
  when:
    - nvidia_test_build | bool
    - not (need_build | bool)
